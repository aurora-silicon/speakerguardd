# A drop-in for the older speaker protection daemons' units (speakerguardd
# 0.1, speakersafetyd), installed by distributions that ship both stacks:
# they start only where speakerguardd v2 does not run and the kernel has no
# v2 interface. See speakerguardd-gate.
#
# "+": the gate runs with full privileges whatever the unit's own user.
# speakersafetyd runs as a DynamicUser, and as that user the gate cannot
# read the upgrade's root-only store (the bundle and the setting): it then
# took a switched Mac for unqualified and started speakersafetyd, which held
# the sense PCM v2's graph needs (RC8 E2E on the M2, 11-09 16:50).
[Service]
ExecCondition=+/usr/libexec/speakerguardd/speakerguardd-gate legacy
