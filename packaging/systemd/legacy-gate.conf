# A drop-in for the older speaker protection daemons' units (speakerguardd
# 0.1, speakersafetyd), installed by distributions that ship both stacks:
# they start only where speakerguardd v2 does not run and the kernel has no
# v2 interface. See speakerguardd-gate.
[Service]
ExecCondition=/usr/libexec/speakerguardd/speakerguardd-gate legacy
