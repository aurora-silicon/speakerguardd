# Generated by packaging/session/gen.py from fixtures/j473.json; do not edit.
# speakerguardd v2 on the Mac mini J473: the only path to the speaker amps is the protect stage.

monitor.alsa.rules = [
    # WirePlumber's own nodes for the speaker PCM and the sense PCM (UCM and
    # pro-audio profiles alike): never created, so no rule (aurora-audio's
    # software-dsp, volume locks) can make a second path to the amps. These
    # rules see only the ALSA monitor's nodes, never sgv2's own.
    {
        matches = [
            { api.alsa.path = "hw:AppleJ473,1" }
            { api.alsa.path = "hw:AppleJ473,2" }
            { alsa.id = "AppleJ473", alsa.device = 1 }
            { alsa.id = "AppleJ473", alsa.device = 2 }
        ]
        actions = {
            update-props = {
                node.disabled = true
            }
        }
    }
]

node.software-dsp.rules = [
    # The machine's voicing in front of the protect stage. Not hidden: the
    # session helper must see the protect stage's ports.
    {
        matches = [
            { node.name = "alsa_output.platform-sound.RawSpeakers", sgv2.stage = "protect", sgv2.machine = "j473" }
        ]
        actions = {
            create-filter = {
                filter-path = "/usr/share/asahi-audio/j473/graph.json"
            }
        }
    }
]
