# Generated by packaging/session/gen.py from fixtures/j616.json; do not edit.
# speakerguardd v2: the built-in microphone of the J616, processed with the Mac's own tuning.

context.objects = [
    {   factory = adapter
        flags = [ nofail ]
        args = {
            factory.name           = api.alsa.pcm.source
            node.name              = "sgv2.mic.raw.j616"
            node.description       = "Microphone Array (raw channels)"
            media.class            = "Audio/Source"
            # The same PCM as hw:AppleJ616HPAI,0, under the name no
            # asahi-audio rule matches (WirePlumber's own node for it is
            # disabled while this file is linked).
            api.alsa.path          = "hw:CARD=AppleJ616HPAI,DEV=0"
            audio.rate             = 48000
            audio.channels         = 3
            audio.position         = [ AUX0 AUX1 AUX2 ]
            # Listed, never the default while any other source exists.
            priority.driver        = 100
            priority.session       = 100
            channelmix.disable     = true
            monitor.channel-volumes = false
            device.icon-name       = "audio-input-microphone"
        }
    }
]

context.modules = [
    {   name = libpipewire-module-filter-chain
        flags = [ nofail ]
        args = {
            node.description = "Built-in Microphone"
            media.name       = "Built-in Microphone"
            filter.graph = {
                nodes = [
                    { type = lv2 name = mic plugin = "https://aurora-silicon.org/lv2/sgv2#mic-3ch" }
                ]
                inputs  = [ "mic:in_0" "mic:in_1" "mic:in_2" ]
                outputs = [ "mic:out" ]
            }
            # The blob is for this rate only (the plugin is silent at any
            # other): both streams stay at it, and their converters
            # resample when the graph runs at another rate.
            capture.props = {
                node.name          = "sgv2.mic.j616.in"
                node.description   = "Built-in Microphone input (internal)"
                audio.rate         = 48000
                audio.channels     = 3
                audio.position     = [ AUX0 AUX1 AUX2 ]
                target.object      = "sgv2.mic.raw.j616"
                # Only ever the array: never moved to another source.
                node.dont-fallback = true
                node.passive       = true
                stream.dont-remix  = true
                sgv2.stage         = "mic"
                sgv2.machine       = "j616"
            }
            playback.props = {
                node.name          = "sgv2.mic.j616"
                node.description   = "Built-in Microphone"
                media.class        = "Audio/Source"
                audio.rate         = 48000
                audio.channels     = 1
                audio.position     = [ MONO ]
                priority.driver    = 2005
                priority.session   = 2005
                node.passive       = true
                node.virtual       = false
                device.icon-name   = "audio-input-microphone"
                sgv2.stage         = "mic"
                sgv2.machine       = "j616"
            }
        }
    }
]
