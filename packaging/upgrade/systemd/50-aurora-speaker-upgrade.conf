# speakerguardd.service.d drop-in (aurora-speaker-upgrade): on kernels with
# the speaker protection interface switch, put the kernel on the v2
# interface before the supervisor starts, only when this Mac was upgraded
# (/var/lib/aurora-speaker-upgrade/interface). A no-op everywhere else.
[Service]
ExecStartPre=-/usr/bin/aurora-speaker-upgrade interface-apply
