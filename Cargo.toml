[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "2.0.0-dev"
edition = "2021"
license = "MIT"
authors = ["The Aurora Silicon Contributors"]
repository = "https://github.com/aurora-silicon/speakerguardd"
rust-version = "1.85"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[profile.release]
# Deterministic floating point: no fast-math exists in Rust; keep
# codegen-units at 1 so inlining (and therefore FMA contraction
# opportunities, which Rust never takes implicitly) is reproducible.
codegen-units = 1
lto = "thin"
panic = "abort"
debug = 1
