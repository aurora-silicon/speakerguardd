# MacBook Air 13" M4 (J713): the J413's chassis, with four SN012776
# amplifiers (a woofer and a tweeter per side) and voltage and current sense
# (S16, 14 V and 3.75 A full scale).  That it has the J413's speakers is
# inferred from the shared chassis and the J713 ADT's per-unit DC
# resistances (/product/audio speaker-thiele-small): 4.00 and 4.10 ohm for
# the woofers and 3.55 and 3.68 ohm for the tweeters, in line with the J413
# constants.  So this is j413.conf on the J713's sense stream: its constants
# and their sources (the J413's own speaker protection, and Asahi Linux's
# speakersafetyd j413.conf, MIT through 2.0.2, the Asahi Linux
# contributors) are as given there.
#
# The M4 AOP's speaker stream is the J616s one: 12 sense channels, of which
# the four amps fill the first eight, I then V per amp in the J413 speaker
# order (LW RW LT RT), and channels 8-11 carry nothing.  The J713 kernel
# (aurora-silicon/linux#439) caps the amp gain index at 15 and holds a locked
# SN012776 at raw volume step 1, about -100 dB, both as on the J413, so the
# J413's safe_reduction applies:
# https://github.com/aurora-silicon/linux/blob/ed2e874ada6424ab687dba03c460c4c3a937f4cc/sound/soc/apple/macaudio.c
# Measured on a J713 (speakerguardd#8, #10): a four-tone chord on playback
# channels 0-3 lands each tone in exactly one amp's I/V pair, V*I is
# positive, and |V|^2/P comes to 4.01, 4.00, 3.73 and 3.73 ohm.
[Globals]
# Not qualified on the machine yet: the daemon refuses to govern this file
# without --allow-unqualified, and udev does not start it, so installing the
# package never displaces speakersafetyd on the J713.
qualified = false
# With --allow-unqualified, the feed-forward model writes the card (the
# unified governor) under the asahi guard: each speaker gets the larger of
# the two reductions, and either latch hands the card to the kernel.  This
# is macOS's order (the signal-driven model always runs; V/I sense checks
# it), with the V/I model kept as a second, independent limit.  The other
# governors run in shadow with --shadow; speakersafetyd hands over at 7 dB.
governor = unified
guard = asahi
max_reduction = 7
sense_pcm = 2
sense_format = s16
channels = 12
period = 4096
t_ambient = 50.0
t_window = 20.0
t_hysteresis = 5.0
t_reduction_max = 20.0
safe_reduction = 99.5
amp_gain_dbv = 18.5
horizon_s = 4.6
release_s = 20.0
t_ctrl_headroom = 0.0

[Controls]
volume = Speaker Volume
unlock = Speaker Volume Unlock
sample_rate = Speaker Sample Rate
vsense = VSENSE Switch
isense = ISENSE Switch
amp_gain = Amp Gain Volume

