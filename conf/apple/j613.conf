# J613 Option A: measured V/I only, with speakersafetyd 2.0.1 policy.
# Shared numeric data: AsahiLinux/speakersafetyd 8c519e9594b6635d8a5e134d36dcb8ab5ea4a00f,
# conf/apple/j613.conf -> j413.conf. MIT notice in ../LICENSE.asahi.
# tr_* / tau_* are ACTIVE measured-power constants (including Asahi's
# tweeter 200 K/W and 1.85 s), not Apple's unmodified open-loop transfer.
# Reb_ref metadata: verified 25G83 AID20 aid20-aufx-spp3-appl.plist,
# SHA256 85d16f9c8305f01374d852c00b40b2bb01bfec048db57a2ad69715ae8686e108.
# r_ff = OL_thermal.Reb_ref (4 / 3.72 ohm); release_s = Thermal_GainReleaseTime_s.
# These are inactive metadata in measured_vi, which constructs no FF model.
# Amp index 15 / gain 18.5 dBV: TAS2764 11 + 0.5*index.
# safe_reduction is retained metadata; measured_vi never estimates fallback power.
# No z_min is inferred. Budgets are explicitly disabled. Epoch kernel required.
# This daemon has not been physically qualified on J613; owner trial is gated.

[Globals]
qualified = false
governor = asahi
sense_pcm = 2
sense_format = s16
channels = 8
period = 4096
t_ambient = 50.0
t_window = 20.0
t_hysteresis = 5.0
safe_reduction = 99.5
amp_gain_dbv = 18.5
amp_gain_index = 15
release_s = 20.0
measured_vi = true
strict_admission = true
shadow = false
boot_resume = latched

[Controls]
vsense = VSENSE Switch
isense = ISENSE Switch
amp_gain = Amp Gain Volume
volume = Speaker Volume
unlock = Speaker Volume Unlock
sample_rate = Speaker Sample Rate

[Speaker/Left Woofer]
group = 1
tr_coil = 32.10
tr_magnet = 20.00
tau_coil = 4.70
tau_magnet = 66.50
t_limit = 140.0
t_headroom = 10.0
z_nominal = 4.00
a_t_20c = 0.00370036
is_scale = 3.75
vs_scale = 14
is_chan = 0
vs_chan = 1
vi_tr_coil = 32.10
vi_tr_magnet = 20.00
vi_tau_coil = 4.70
vi_tau_magnet = 66.50
r_ff = 4.00
p_limit_1s = 0
p_limit_60s = 0

