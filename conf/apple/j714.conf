# [S] Speaker/Left Woofer 1.is_scale (UNVERIFIED sibling value).
is_scale = 3.75
# [S] Speaker/Left Woofer 1.vs_scale (UNVERIFIED sibling value).
vs_scale = 14
# [S] Speaker/Left Woofer 1.is_chan (UNVERIFIED sibling value).
is_chan = 0
# [S] Speaker/Left Woofer 1.vs_chan (UNVERIFIED sibling value).
vs_chan = 1
# [S] Speaker/Left Woofer 1.tr_coil, measured-power model (sibling).
vi_tr_coil = 28.09
# [S] Speaker/Left Woofer 1.tr_magnet, measured-power model (sibling).
vi_tr_magnet = 34.43
# [S] Speaker/Left Woofer 1.tau_coil, measured-power model (sibling).
vi_tau_coil = 3.05
# [S] Speaker/Left Woofer 1.tau_magnet, measured-power model (sibling).
vi_tau_magnet = 192.45
# [B] lowest published sibling DC resistance, conservative placeholder (ohm).
r_ff = 2.7
# [B] same conservative placeholder as r_ff; no measured lower bound for this unit.
z_min = 2.7
# [N] Additional public sibling energy caps (W), not this driver
# rating. These tighten the thermal/Asahi guard; unit budgets are unknown.
p_limit_1s = 2.8154
p_limit_60s = 2.5

