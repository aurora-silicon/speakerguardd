# MacBook Pro 16" M4 Pro/Max (J616s/c): six SN012776 amplifiers (two woofers
# and a tweeter per side) on the AOP's serializer, with voltage and current
# sense (S16, 14 V and 3.75 A full scale), 12 sense channels in the order the
# device tree's sense slots give (speaker i at bytes 4i (I) and 4i + 2 (V):
# LW1 RW1 LW2 RW2 LT RT).  Verify the channel map with a capture (V*I
# positive, |V/I| near the coil resistance) before the first playback.
#
# The machine's own protection tunes it exactly as the J316 ("spp3" family
# S2: the same speaker type across J316, J416, J516, J616 and J716), so the
# feed-forward constants and r_ff are the J316's 25G83 values, and the
# measured-power (vi_*) constants and z_nominal are Asahi Linux's
# speakersafetyd j316.conf values (MIT through 2.0.2; the Asahi Linux
# contributors), which speakersafetyd has no J616 profile for.  Hard limit
# 150 C, working limit 140 C.
[Globals]
# Not qualified: no J616 capture has verified the sense map, polarity or
# scaling, and the thermal constants are borrowed from the J316.  The daemon
# refuses to govern this file without --allow-unqualified, and udev does not
# start it on this machine.  It stays here for offline work (replay).
qualified = false
# With --allow-unqualified, speakersafetyd's behaviour (asahi governor)
# writes the card; the other governors run in shadow with --shadow.
# speakersafetyd hands over at 7 dB.
governor = asahi
max_reduction = 7
sense_pcm = 2
sense_format = s16
channels = 12
period = 4096
t_ambient = 50.0
t_window = 20.0
t_hysteresis = 5.0
t_reduction_max = 20.0
# SN012776 cards lock the speakers to -100 dB without a daemon (macaudio)
safe_reduction = 99.5
# "Amp Gain Volume" at its maximum: 11 dB + 15 * 0.5 dB
amp_gain_dbv = 18.5
horizon_s = 4.6
release_s = 20.0
t_ctrl_headroom = 0.0

[Controls]
volume = Speaker Volume
unlock = Speaker Volume Unlock
sample_rate = Speaker Sample Rate
vsense = VSENSE Switch
isense = ISENSE Switch
amp_gain = Amp Gain Volume

[Speaker/Left Woofer 1]
group = 1
tr_coil = 26.06
tr_magnet = 25.55
tau_coil = 5.532
tau_magnet = 197.25
r_ff = 2.7
vi_tr_coil = 23.0
vi_tr_magnet = 40.0
vi_tau_coil = 5.6
vi_tau_magnet = 197.25
t_limit = 150.0
t_headroom = 10.0
z_nominal = 3.6
a_t_20c = 0.003748952
is_scale = 3.75
vs_scale = 14
is_chan = 0
vs_chan = 1

