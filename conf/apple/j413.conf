tau_magnet = 70.0
r_ff = 3.72
vi_tr_coil = 104.9
vi_tr_magnet = 200.0
vi_tau_coil = 1.85
vi_tau_magnet = 70.0
t_limit = 150.0
t_headroom = 10.0
