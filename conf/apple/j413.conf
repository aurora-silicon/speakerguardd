# MacBook Air 13" M2 (J413): four SN012776 amplifiers (a woofer and a tweeter
# per side) with voltage and current sense (S16, 14 V and 3.75 A full scale),
# 8 sense channels.  Constants as in j316.conf: the feed-forward set and r_ff
# from the machine's own speaker protection (25G83 AID13 "spp3"), the vi_* set
# and z_nominal from Asahi Linux's speakersafetyd j413.conf (MIT through 2.0.2;
# the Asahi Linux contributors), whose tweeter values were tuned by hand
# against test tones.  Hard limit 150 C, working limit 140 C.
[Globals]
# speakersafetyd's behaviour (asahi governor) writes the card; the other
# governors run in shadow with --shadow.  speakersafetyd hands over at 7 dB.
governor = asahi
max_reduction = 7
sense_pcm = 2
sense_format = s16
channels = 8
period = 4096
t_ambient = 50.0
t_window = 20.0
t_hysteresis = 5.0
t_reduction_max = 20.0
safe_reduction = 99.5
amp_gain_dbv = 18.5
horizon_s = 4.6
release_s = 20.0
t_ctrl_headroom = 0.0

[Controls]
volume = Speaker Volume
unlock = Speaker Volume Unlock
sample_rate = Speaker Sample Rate
vsense = VSENSE Switch
isense = ISENSE Switch
amp_gain = Amp Gain Volume

[Speaker/Left Woofer]
group = 1
tr_coil = 32.1
tr_magnet = 20.0
tau_coil = 4.7
tau_magnet = 66.5
r_ff = 4.0
vi_tr_coil = 32.1
vi_tr_magnet = 20.0
vi_tau_coil = 4.7
vi_tau_magnet = 66.5
t_limit = 150.0
t_headroom = 10.0
z_nominal = 4.0
a_t_20c = 0.003700364
is_scale = 3.75
vs_scale = 14
is_chan = 0
vs_chan = 1

[Speaker/Right Woofer]
group = 1
tr_coil = 32.1
tr_magnet = 20.0
tau_coil = 4.7
tau_magnet = 66.5
r_ff = 4.0
vi_tr_coil = 32.1
vi_tr_magnet = 20.0
vi_tau_coil = 4.7
vi_tau_magnet = 66.5
t_limit = 150.0
t_headroom = 10.0
z_nominal = 4.0
a_t_20c = 0.003700364
is_scale = 3.75
vs_scale = 14
is_chan = 2
vs_chan = 3

[Speaker/Left Tweeter]
group = 0
