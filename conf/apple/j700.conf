# MacBook Neo (J700): one MAX98360A per channel, no sense lines.  The speaker
# sense PCM carries the words the amplifier receives; power is estimated from
# them (feed-forward), see README.md.  Speaker constants: the machine's own
# CoreAudio loudspeaker-manager tuning (facts about the hardware, recorded in
# the bring-up provenance file); thermal constants are conservative
# placeholders until measured or recovered from the same tuning.
[Globals]
sense_pcm = 2
t_ambient = 35.0
t_hysteresis = 5.0
t_window = 20.0
channels = 2
period = 4096

[Controls]
volume = Speaker Playback Volume
unlock = Speaker Volume Unlock
sample_rate = Speaker Sample Rate

[Speaker/Left]
group = 0
tr_coil = 60.00
tr_magnet = 40.00
tau_coil = 3.00
tau_magnet = 200.00
t_limit = 110.0
t_headroom = 10.0
z_nominal = 4.43
vs_scale = 3.3
vs_chan = 0

[Speaker/Right]
group = 0
tr_coil = 60.00
tr_magnet = 40.00
tau_coil = 3.00
tau_magnet = 200.00
t_limit = 110.0
t_headroom = 10.0
z_nominal = 4.43
vs_scale = 3.3
vs_chan = 1
