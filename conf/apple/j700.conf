# MacBook Neo (J700): one MAX98360A per channel, no sense lines.  The speaker
# sense PCM carries the words the amplifier receives; power is estimated from
# them (feed-forward), see README.md.  Every constant below is a property of
# this machine's speaker/amplifier pair as configured by its own CoreAudio
# loudspeaker manager (facts about the hardware, read back through the public
# AudioUnit API and recorded in the bring-up provenance file): thermal
# resistances and time constants of the coil and magnet, the assumed chassis
# ambient, the coil temperature limits (135 hard, governed to the 120 soft
# limit), the amplifier's volts at full scale, the coil resistance and the
# 1 s / 60 s power budgets.
[Globals]
sense_pcm = 2
t_ambient = 50.0
t_hysteresis = 5.0
t_window = 20.0
channels = 2
period = 4096

[Controls]
volume = Speaker Playback Volume
unlock = Speaker Volume Unlock
sample_rate = Speaker Sample Rate

[Speaker/Left]
group = 0
tr_coil = 38.0
tr_magnet = 26.0
tau_coil = 3.3
tau_magnet = 100.0
t_limit = 135.0
t_headroom = 15.0
z_nominal = 4.2
vs_scale = 7.3
vs_chan = 0
p_limit_1s = 2.8154
p_limit_60s = 2.5

[Speaker/Right]
group = 0
tr_coil = 38.0
tr_magnet = 26.0
tau_coil = 3.3
tau_magnet = 100.0
t_limit = 135.0
t_headroom = 15.0
z_nominal = 4.2
vs_scale = 7.33
vs_chan = 1
p_limit_1s = 2.8154
p_limit_60s = 2.5
