# MacBook Pro 16" M1 Pro/Max (J316): six SN012776 amplifiers (two woofers and a
# tweeter per side) with voltage and current sense (S16, 14 V and 3.75 A full
# scale per the TAS2764-class datasheet), 12 sense channels.
#
# Two sets of thermal constants per speaker:
# - tr_coil/tau_coil/tr_magnet/tau_magnet with r_ff: the feed-forward
#   (open-loop) model as the machine's own speaker protection tunes it today
#   (25G83 AID9 "spp3" values: facts about the hardware), driven by the
#   amplifier voltage against the reference DC resistance r_ff;
# - vi_*: the model driven by measured V*I power, with the values Asahi
#   Linux's speakersafetyd ships for this machine (conf/apple/j316.conf,
#   MIT-licensed through 2.0.2; the Asahi Linux contributors), which were
#   validated against test tones that way.  z_nominal is theirs too.
# t_limit is the hard limit (the protection unit's limit plus its 10 C
# headroom); the working limit is t_limit - t_headroom = 140 C, the target of
# both macOS's regulator and speakersafetyd's ramp.
[Globals]
# Not qualified on the machine yet: the daemon refuses to govern this file
# without --allow-unqualified, and udev does not start it, so installing the
# package never displaces speakersafetyd on the M1 Pro.
qualified = false
# With --allow-unqualified, speakersafetyd's behaviour (asahi governor)
# writes the card; the other governors run in shadow with --shadow.
# Deep governed attenuation keeps hot-start audio under the thermal bound.
governor = asahi
max_reduction = 60
sense_pcm = 2
sense_format = s16
channels = 12
period = 4096
t_ambient = 50.0
t_window = 20.0
t_hysteresis = 5.0
t_reduction_max = 20.0
# SN012776 cards lock the speakers to -100 dB without a daemon (macaudio)
safe_reduction = 99.5
# "Amp Gain Volume" at its maximum: 11 dB + 15 * 0.5 dB
amp_gain_dbv = 18.5
horizon_s = 4.6
release_s = 20.0
t_ctrl_headroom = 0.0

[Controls]
volume = Speaker Volume
unlock = Speaker Volume Unlock
sample_rate = Speaker Sample Rate
vsense = VSENSE Switch
isense = ISENSE Switch
amp_gain = Amp Gain Volume

[Speaker/Left Woofer 1]
group = 1
tr_coil = 26.06
tr_magnet = 25.55
tau_coil = 5.532
tau_magnet = 197.25
r_ff = 2.7
vi_tr_coil = 23.0
vi_tr_magnet = 40.0
vi_tau_coil = 5.6
vi_tau_magnet = 197.25
t_limit = 150.0
t_headroom = 10.0
z_nominal = 3.6
a_t_20c = 0.003748952
is_scale = 3.75
vs_scale = 14
is_chan = 0
vs_chan = 1

