# [S] https://github.com/AsahiLinux/speakersafetyd/blob/8c519e9594b6635d8a5e134d36dcb8ab5ea4a00f/conf/apple/j413.conf
# [B] https://github.com/aurora-silicon/speakerguardd/blob/c020028b13515ba29767bdc325f3bd7c7cb9101a/conf/apple/j316.conf
# [N] https://github.com/aurora-silicon/speakerguardd/blob/c020028b13515ba29767bdc325f3bd7c7cb9101a/conf/apple/j700.conf
# [K] https://github.com/aurora-silicon/linux/blob/070c8e4d43a40ac464fe8bd491c090688a92b63a/sound/soc/apple/macaudio.c
# [T] https://github.com/aurora-silicon/linux/blob/070c8e4d43a40ac464fe8bd491c090688a92b63a/sound/soc/codecs/tas2770.c
# [U] https://github.com/aurora-silicon/linux/blob/070c8e4d43a40ac464fe8bd491c090688a92b63a/sound/soc/codecs/tas2764.c
# [V] https://github.com/AsahiLinux/speakersafetyd/blob/8c519e9594b6635d8a5e134d36dcb8ab5ea4a00f/src/helpers.rs
# [D] https://github.com/AsahiLinux/speakersafetyd/blob/8c519e9594b6635d8a5e134d36dcb8ab5ea4a00f/docs/speakers.txt
# Board identity: https://asahilinux.org/docs/hw/devices/device-list/
# Numeric assignments cite these sources in the preceding comment.
# [A] https://www.apple.com/macbook-air/specs/
# [A] establishes 4 speakers only. Roles, SN012776-class amps,
# S16 V/I format, PCM, channels, controls, scales and thermal constants below
# are UNVERIFIED sibling assumptions from [S], not measurements of J813.
# A compatible kernel audio route and protection interlock are prerequisites.
# [S] is the conservative family fallback described in ../../PROFILES.md.
# [L] https://github.com/AsahiLinux/speakersafetyd/blob/8c519e9594b6635d8a5e134d36dcb8ab5ea4a00f/conf/apple/j313.conf
# [L] lower hard limit and larger headroom of the older 13-inch Air.
# FF thermal constants fall back to the measured-power constants in [S].
# This transfer has not been validated. [B]'s lowest resistance (2.7 ohm)
# is used for r_ff/z_min, below every nominal impedance in [S]. This raises
# the voltage-based power estimate; it is NOT a measured minimum here.
# The Asahi measured-power guard remains active. See ../../PROFILES.md.
# No loud playback, qualification claim or automatic service enablement.

[Globals]
# Untested profiles must be refused before the unlock without an explicit opt-in.
qualified = false
# FF primary, with the measured-power safety guard; policy as supported by src/config.rs.
governor = unified
guard = asahi
# [B] hand back to the kernel at this reduction (dB).
max_reduction = 7
# [S] visense_pcm, renamed to sense_pcm.
sense_pcm = 2
# [V] signed 16-bit capture; [S] interleaved voltage/current slots.
sense_format = s16
# [S] Globals.channels (sibling assumption).
channels = 8
# [S] Globals.period (sibling assumption).
period = 4096
# [S] Globals.t_ambient (sibling assumption).
t_ambient = 50.0
# [S] Globals.t_window (sibling assumption).
t_window = 20.0
# [S] Globals.t_hysteresis (sibling assumption).
t_hysteresis = 5.0
# [B] thermal ramp reduction (dB).
t_reduction_max = 20.0
# [N] 20 dB is the highest-powered public sibling fallback. The kernel
# fallback on this board is UNVERIFIED; do not assume the TI mute level.
safe_reduction = 20.0
# [K], [T], [U] 11 dBV + 0.5 dB * capped amp gain index; highest sibling cap 20, UNVERIFIED on this board.
amp_gain_dbv = 21
# The amp gain control value amp_gain_dbv stands for (11 dBV + 0.5 dB per
# step): the daemon writes it, not a higher maximum the card may offer.
amp_gain_index = 20
# [B] prediction horizon (s), sibling policy fallback.
horizon_s = 4.6
# [B] release time (s), sibling policy fallback.
release_s = 20.0
# [N] extra regulator margin (K), conservative sibling policy fallback.
t_ctrl_headroom = 5.0
# Keep thermal/power caps disabled, so they cannot cap away protection.
unified_caps = false

[Controls]
# [S] UNVERIFIED sibling control name.
vsense = VSENSE Switch
# [S] UNVERIFIED sibling control name.
isense = ISENSE Switch
# [S] UNVERIFIED sibling control name.
amp_gain = Amp Gain Volume
# [S] UNVERIFIED sibling control name.
volume = Speaker Volume
# [B] kernel interlock controls (UNVERIFIED sibling names).
unlock = Speaker Volume Unlock
sample_rate = Speaker Sample Rate

[Speaker/Left Woofer]
# [S] Speaker/Left Woofer.group (UNVERIFIED sibling value).
group = 1
# [S] Speaker/Left Woofer.tr_coil (UNVERIFIED sibling value).
tr_coil = 32.10
# [S] Speaker/Left Woofer.tr_magnet (UNVERIFIED sibling value).
tr_magnet = 20.00
# [S] Speaker/Left Woofer.tau_coil (UNVERIFIED sibling value).
tau_coil = 4.70
# [S] Speaker/Left Woofer.tau_magnet (UNVERIFIED sibling value).
tau_magnet = 66.50
# [L] t_limit, conservative 13-inch Air sibling limit (UNVERIFIED).
t_limit = 120.0
# [L] t_headroom, conservative 13-inch Air sibling limit (UNVERIFIED).
t_headroom = 15.0
# [S] Speaker/Left Woofer.z_nominal (UNVERIFIED sibling value).
z_nominal = 4.00
# [S] Speaker/Left Woofer.a_t_20c (UNVERIFIED sibling value).
a_t_20c = 0.00370036
# [S] Speaker/Left Woofer.is_scale (UNVERIFIED sibling value).
is_scale = 3.75
# [S] Speaker/Left Woofer.vs_scale (UNVERIFIED sibling value).
vs_scale = 14
# [S] Speaker/Left Woofer.is_chan (UNVERIFIED sibling value).
is_chan = 0
# [S] Speaker/Left Woofer.vs_chan (UNVERIFIED sibling value).
vs_chan = 1
# [S] Speaker/Left Woofer.tr_coil, measured-power model (sibling).
vi_tr_coil = 32.10
# [S] Speaker/Left Woofer.tr_magnet, measured-power model (sibling).
vi_tr_magnet = 20.00
# [S] Speaker/Left Woofer.tau_coil, measured-power model (sibling).
vi_tau_coil = 4.70
# [S] Speaker/Left Woofer.tau_magnet, measured-power model (sibling).
vi_tau_magnet = 66.50
# [B] lowest published sibling DC resistance, conservative placeholder (ohm).
r_ff = 2.7
# [B] same conservative placeholder as r_ff; no measured lower bound for this unit.
z_min = 2.7
# [N] Additional public sibling energy caps (W), not this driver
# rating. These tighten the thermal/Asahi guard; unit budgets are unknown.
p_limit_1s = 2.8154
p_limit_60s = 2.5

