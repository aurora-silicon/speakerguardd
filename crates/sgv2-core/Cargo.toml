[package]
name = "sgv2-core"
description = "In-graph speaker protection core: one framework for spp3, lsm2 and atsp"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[features]
# Host-side helpers (blob building); the plugin and the RT path never need it.
std = []
# PROVISIONAL (rig law 5, not yet confirmed on held-out cases): velocity
# band gains water-filled across the bands instead of the full-band
# candidate on every band. Off by default.
lsm2-waterfill = []
# Deliberately quieter LowFlow fallback. The default build carries the exact
# detector/state law; this feature retains the fixed guarded ceiling for an
# explicitly conservative image or an incomplete legacy sidecar.
lowflow-conservative = []
# Plan A tonight (2026-11-07): the shipped builds take the conservative
# LowFlow until its exact law passes the rig (t-5476). Without it the j413
# voicing refuses to compile (fails closed). Remove once LowFlow is exact.
default = ["lowflow-conservative"]

[dependencies]
# Pure-Rust, no_std, correctly rounded sqrt and a portable exp: the same
# results on every target, which the differential rig depends on.
libm = "0.2"

[dev-dependencies]
sgv2-core = { path = ".", features = ["std"] }
proptest = { version = "1", default-features = false, features = ["std"] }

[lints]
workspace = true
