[package]
name = "aurora-speaker-tuning"
description = "Reader and validator for a Mac's own speaker tuning bundle, as collected by the Aurora installer"
version.workspace = true
edition.workspace = true
license = "MIT"
authors = ["The Aurora Silicon Contributors", "saku"]
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
sgv2-core = { path = "../sgv2-core", features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tar = { version = "0.4", default-features = false }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }

[dev-dependencies]
sgv2-lv2 = { path = "../sgv2-lv2" }

[[bin]]
name = "aurora-speaker-tuning"
path = "src/bin/aurora-speaker-tuning.rs"
